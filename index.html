<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chopi AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030d08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chopi AI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030d08; --bg2:#06170e; --card:#0a2216; --card2:#0c2d1c;
  --line:rgba(34,197,94,.38); --line2:rgba(34,197,94,.18);
  --g1:#5ee38a; --g2:#00c26f; --green:#22d36b;
  --red:#ff3347; --red2:#8b1320;
  --text:#f2fff7; --muted:#8caf9a; --dim:#5d7d6a;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:500;font-synthesis:weight;
  background-image:radial-gradient(480px 304px at 85% -5%,rgba(34,197,94,.22),transparent 70%),radial-gradient(400px 320px at 0% 55%,rgba(0,194,111,.10),transparent 70%);
  background-attachment:fixed}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font-family:inherit;color:inherit}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{max-width:480px;margin:0 auto;padding:12px 14px 40px;position:relative}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;height:53px;padding:0 11px 0 10px;border-radius:21px;
  background:linear-gradient(180deg,rgba(6,24,15,.95),rgba(3,13,8,.95));border:1px solid var(--line);
  box-shadow:0 0 22px rgba(34,197,94,.10),inset 0 0 16px rgba(34,197,94,.05)}
.burger{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.04)}
.brand{font-size:18px;font-weight:700;letter-spacing:-.3px}
.brand b{color:var(--g1);font-weight:700}
.avatar{width:37px;height:37px;border-radius:50%;border:2px solid var(--green);box-shadow:0 0 11px rgba(34,211,107,.5);overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#1a6b3d,#04150c 70%)}
.avatar.lg{width:62px;height:62px;border-radius:19px;border-width:3px}
.avatar svg{width:100%;height:100%}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* common cards */
.card{border-radius:24px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(14,60,36,.85),rgba(5,22,13,.92) 55%);
  box-shadow:0 0 24px rgba(34,197,94,.08),inset 0 1px 0 rgba(255,255,255,.04)}
.card.flat{background:linear-gradient(180deg,rgba(8,30,19,.9),rgba(4,16,10,.95))}
.sub{border-radius:18px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(14,50,32,.6),rgba(4,18,11,.8))}
.mt{margin-top:11px}
.eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:var(--g1);text-transform:uppercase}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:79px;border:1px solid var(--line);
  background:rgba(2,12,7,.55);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--g1);white-space:nowrap}
.chip.dim{color:var(--muted);font-weight:600;letter-spacing:0;border-color:var(--line2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:none}
.btn{width:100%;height:46px;border-radius:79px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;
  color:#02150a;background:linear-gradient(90deg,var(--g1),var(--g2));border:1px solid rgba(160,255,200,.5);
  box-shadow:0 0 24px rgba(34,211,107,.35),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn.dis{background:linear-gradient(90deg,#2c8a4c,#1f7a45);color:#06200f;box-shadow:none;border-color:transparent;opacity:.85}
.btn i,.btn svg{font-size:18px}
.btn.sm{height:40px;font-size:13px}
.page-head{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:21px;border:1px solid var(--line);
  background:linear-gradient(100deg,rgba(8,34,21,.9) 40%,rgba(30,110,60,.35));margin-top:11px}
.ico{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:21px;color:#03140a;
  background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 0 18px rgba(34,211,107,.35);flex:none}
.ico.soft{background:rgba(34,197,94,.14);color:var(--g1);box-shadow:none;border:1px solid var(--line2)}
.ph-t{flex:1;min-width:0}
.ph-t h2{margin:2px 0 0;font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


/* ---------- auth / login & registration ---------- */
.auth-page{min-height:calc(100vh - 52px);display:flex;flex-direction:column;padding:22px 0 10px}
.auth-brand{display:flex;align-items:center;gap:15px;padding:0 8px 22px;margin-bottom:18px;border-bottom:1px solid rgba(34,197,94,.13)}
.auth-brand .avatar{width:72px;height:72px;border-radius:24px;border-width:2px;flex:none;box-shadow:0 0 20px rgba(34,211,107,.28)}
.auth-brand .name{font-size:28px;line-height:1.05;font-weight:800;letter-spacing:-1px}
.auth-brand .name b{color:var(--green)}
.auth-brand .tagline{display:block;margin-top:6px;color:#8caf9a;font-size:13px;font-weight:600}
.auth-card{margin-top:4px;padding:22px 18px 20px;border-radius:31px;border:1px solid rgba(34,211,107,.48);background:linear-gradient(150deg,rgba(7,39,24,.96),rgba(2,19,11,.98) 58%,rgba(2,14,8,.99));box-shadow:0 0 30px rgba(34,211,107,.07),inset 0 1px 0 rgba(255,255,255,.035);overflow:hidden;position:relative}
.auth-card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(330px 210px at 92% 3%,rgba(0,194,111,.22),transparent 68%),radial-gradient(260px 220px at 5% 48%,rgba(34,211,107,.06),transparent 70%)}
.auth-inner{position:relative;z-index:1}
.auth-tabs{height:76px;padding:7px;border-radius:24px;border:1px solid rgba(34,197,94,.24);background:rgba(2,24,14,.58);display:grid;grid-template-columns:1fr 1fr;gap:7px;box-shadow:inset 0 0 18px rgba(34,197,94,.035)}
.auth-tab{height:60px;border-radius:19px;color:#91ab9b;font-size:16px;font-weight:800;transition:.18s ease}
.auth-tab.on{color:#02150a;background:linear-gradient(100deg,#4fe78a,#00c96f);box-shadow:0 0 22px rgba(0,201,111,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.auth-title{text-align:center;margin:31px 0 5px;font-size:31px;line-height:1.15;font-weight:800;letter-spacing:-1.2px}
.auth-desc{text-align:center;color:#92b09f;font-size:15px;line-height:1.55;margin:0 auto 27px;max-width:330px}
.auth-form{display:grid;gap:15px}
.auth-input{height:68px;border-radius:22px;border:1px solid rgba(94,227,138,.19);background:rgba(4,31,20,.82);display:flex;align-items:center;gap:14px;padding:0 17px;color:#9db9a8;box-shadow:inset 0 1px 0 rgba(255,255,255,.025);transition:border-color .18s,box-shadow .18s}
.auth-input:focus-within{border-color:rgba(34,211,107,.55);box-shadow:0 0 0 3px rgba(34,211,107,.06),inset 0 1px 0 rgba(255,255,255,.035)}
.auth-input .i{font-size:25px;color:#9ab7a7}
.auth-input input{width:100%;height:100%;border:0;outline:0;background:transparent;font-size:16px;color:var(--text);font-weight:600}
.auth-input input::placeholder{color:#8ca99a;opacity:1}
.auth-eye{width:34px;height:34px;display:grid;place-items:center;color:#9ab7a7;font-size:22px;flex:none}
.auth-options{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 1px 2px;color:#91ad9e;font-size:13px;font-weight:600}
.remember{display:flex;align-items:center;gap:9px;cursor:pointer}
.remember input{appearance:none;width:22px;height:22px;border-radius:4px;border:1px solid #759084;background:rgba(255,255,255,.13);margin:0;position:relative}
.remember input:checked{background:var(--green);border-color:var(--green)}
.remember input:checked:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#03200f;font-size:14px;font-weight:900}
.auth-link{color:var(--green);font-weight:800;text-decoration:none}
.auth-submit{height:66px;border-radius:21px;font-size:18px;font-weight:800;margin-top:4px}
.auth-divider{display:flex;align-items:center;gap:14px;margin:25px 0 19px;color:#8aa697;font-size:13px;font-weight:700;letter-spacing:.08em}
.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:rgba(117,165,140,.18)}
.google-btn{height:64px;border-radius:21px;border:1px solid rgba(94,227,138,.17);background:rgba(4,29,19,.78);display:flex;align-items:center;justify-content:center;gap:16px;font-size:16px;font-weight:800;color:#e9f6ef;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.google-g{font-family:Arial,sans-serif;font-size:29px;font-weight:800;line-height:1;background:conic-gradient(from -45deg,#4285f4 0 25%,#34a853 25% 48%,#fbbc05 48% 72%,#ea4335 72% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-bottom{text-align:center;color:#91ad9e;font-size:14px;margin:25px 0 2px}
.auth-bottom button{color:var(--green);font-size:14px;font-weight:800;margin-left:3px}
.auth-note{text-align:center;color:#5f7d6c;font-size:10px;line-height:1.45;margin:15px auto 0;max-width:300px}
.auth-err{min-height:18px;text-align:center;color:#ff8e9a;font-size:12px;font-weight:700;margin:-5px 0 0}
.auth-page .disc{margin-top:13px}
@media(max-width:380px){.auth-card{padding:18px 13px 17px}.auth-title{font-size:27px}.auth-brand .name{font-size:25px}.auth-brand .avatar{width:64px;height:64px}.auth-input{height:62px}.auth-submit{height:60px}}

/* dashboard */
.welcome{padding:18px 14px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.welcome .who{flex:1;min-width:0}
.welcome .eyebrow{line-height:1.7;letter-spacing:.3em}
.welcome h1{margin:2px 0 8px;font-size:32px;font-weight:800;letter-spacing:-1px}
.cc{display:flex;gap:12px;flex:none}
.cc .col{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:106px}
.cc .col.a{justify-content:flex-start}.cc .col.b{justify-content:flex-end}
.candle{width:29px;border-radius:6px;position:relative}
.candle::before{content:"";position:absolute;left:50%;width:3px;transform:translateX(-50%);top:-14px;bottom:-14px;border-radius:3px;background:inherit}
.candle.up{height:44px;background:linear-gradient(180deg,#33f07c,#0fa84b);box-shadow:0 0 18px rgba(51,240,124,.6)}
.candle.dn{height:46px;background:linear-gradient(180deg,#ff3a4c,#d00f26);box-shadow:0 0 18px rgba(255,51,71,.6);margin:14px 0}
.tag-sell,.tag-buy{font-size:11px;font-weight:700;letter-spacing:.06em;height:26px;padding:0 9px;border-radius:99px;display:flex;gap:5px;align-items:center;border:1px solid var(--line);background:rgba(2,12,7,.6);color:var(--g1);white-space:nowrap}
.tag-sell{color:var(--red);border-color:rgba(255,51,71,.45);background:rgba(35,5,10,.62);text-shadow:0 0 8px rgba(255,51,71,.22)}
.tag-sell svg,.tag-buy svg{font-size:13px}
.limit{padding:13px}
.limit .row{display:flex;gap:11px;align-items:center}
.limit h3{margin:0 0 6px;font-size:17px;font-weight:700}
.hex{width:51px;height:51px;border-radius:16px;background:rgba(34,197,94,.1);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;color:var(--g1);position:relative;flex:none}
.hex .dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px}
.locked{padding:21px 13px 14px;text-align:center;margin-top:11px;
  background-image:linear-gradient(rgba(34,197,94,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.06) 1px,transparent 1px),linear-gradient(160deg,rgba(14,60,36,.6),rgba(5,22,13,.9));background-size:29px 29px,29px 29px,auto}
.lockring{width:77px;height:77px;margin:0 auto 11px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;box-shadow:0 0 24px rgba(34,211,107,.15)}
.lockring span{width:58px;height:58px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;font-size:26px;color:var(--g1);background:rgba(3,16,9,.7)}
.locked h3{margin:10px 0 5px;font-size:18px;font-weight:700}
.locked p{margin:0 auto;font-size:12px;line-height:1.5;color:var(--muted);max-width:248px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tool{border-radius:16px;border:1px solid var(--line2);background:rgba(4,18,11,.7);padding:10px 3px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#d7efe0}
.tool .t{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:var(--g1);background:rgba(34,197,94,.16)}
.tool:active{transform:scale(.97)}

/* upload */
.drop{margin:11px;border-radius:24px;border:1.5px dashed rgba(34,197,94,.3);padding:27px 14px 24px;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(34,197,94,.10),transparent 60%)}
.pulse{width:107px;height:107px;border-radius:50%;margin:0 auto 18px;border:1px solid var(--line2);display:grid;place-items:center;position:relative}
.pulse::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed var(--line2)}
.pulse span{width:77px;height:77px;border-radius:24px;display:grid;place-items:center;font-size:35px;color:#02140a;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 0 24px rgba(34,211,107,.45);z-index:1}
.drop h3{margin:0 0 10px;font-size:22px;font-weight:700;letter-spacing:-.5px}
.drop p{margin:0 auto 19px;color:var(--muted);font-size:14px;line-height:1.55;max-width:240px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.upl{width:auto;display:inline-flex;padding:0 28px;cursor:pointer}
.drop.over{border-color:var(--green);background:radial-gradient(circle at 50% 30%,rgba(34,197,94,.25),transparent 60%)}
.thumb{display:block;max-height:180px;max-width:100%;margin:0 auto 14px;border-radius:18px;border:1px solid var(--line);box-shadow:0 0 24px rgba(34,211,107,.25)}
.chartprev{margin:0 10px 10px;border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:#02100a;display:flex;gap:12px;align-items:center;padding:8px}
.chartprev img{width:72px;height:54px;object-fit:cover;border-radius:12px;flex:none}
.chartprev span{font-size:13px;color:var(--muted)}
.upwrap{position:relative;display:inline-block}
.upl{pointer-events:none}
.ovl{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.lnk{display:block;margin:14px auto 0;color:var(--g1);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fmt{margin-top:13px;font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--dim)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 11px 13px}
.trio div{border-radius:18px;border:1px solid var(--line2);background:rgba(4,18,11,.7);padding:13px 3px 11px;text-align:center;font-weight:600;font-size:12px;color:#c8e2d2}
.trio .c{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(34,197,94,.1);color:var(--g1);font-size:19px}
.analyzing{margin:11px;border-radius:24px;border:1px solid var(--line);padding:24px 13px;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(34,197,94,.14),rgba(3,13,8,.9) 70%)}
.net{position:relative;height:200px}
.net .node{position:absolute;width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:19px;color:var(--g1);border:1px solid var(--line);background:rgba(34,197,94,.14);animation:blink 1.6s infinite}
.net .core{left:50%;top:50%;transform:translate(-50%,-50%);width:67px;height:67px;border-radius:50%;display:grid;place-items:center;position:absolute;border:2px solid #fff;
  background:radial-gradient(circle,#0f5c33,#031a0d);box-shadow:0 0 0 6px rgba(34,211,107,.18),0 0 32px rgba(34,211,107,.6);font-style:italic;font-weight:800;font-size:14px}
.net svg.l{position:absolute;inset:0;width:100%;height:100%}
.net line{stroke:rgba(94,227,138,.4);stroke-width:1.5;stroke-dasharray:4 5;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
@keyframes blink{50%{opacity:.55;box-shadow:0 0 13px rgba(34,211,107,.5)}}
.scanbox{position:relative;margin:0 auto;width:100%;max-width:560px;aspect-ratio:1.62;min-height:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 24px rgba(34,211,107,.20);background:#041009}
.scanbox img{display:block;width:100%;height:100%;max-height:none;object-fit:contain;filter:brightness(.9);background:#07140f;transform-origin:center;animation:chart-breathe 4.2s ease-in-out infinite}
.gridov{position:absolute;inset:0;background-image:linear-gradient(rgba(34,197,94,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.16) 1px,transparent 1px);background-size:22px 22px;animation:grid-drift 9s linear infinite}
.beam{position:absolute;left:0;right:0;height:48px;top:-48px;background:linear-gradient(180deg,transparent,rgba(94,227,138,.4));border-bottom:2px solid #5ee38a;box-shadow:0 8px 26px rgba(94,227,138,.8);animation:beam 2.9s ease-in-out infinite}
@keyframes beam{0%{top:-48px;opacity:.25}12%{opacity:1}88%{opacity:1}100%{top:100%;opacity:.2}}
@keyframes chart-breathe{0%,100%{filter:brightness(.88);transform:scale(1)}50%{filter:brightness(1.04);transform:scale(1.012)}}
@keyframes grid-drift{to{background-position:22px 22px,22px 22px}}
.cn{position:absolute;width:18px;height:18px;border:0 solid #5ee38a}
.cn.tl{top:8px;left:8px;border-width:2px 0 0 2px;border-top-left-radius:6px}.cn.tr{top:8px;right:8px;border-width:2px 2px 0 0;border-top-right-radius:6px}
.cn.bl{bottom:8px;left:8px;border-width:0 0 2px 2px;border-bottom-left-radius:6px}.cn.br{bottom:8px;right:8px;border-width:0 2px 2px 0;border-bottom-right-radius:6px}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.07);max-width:300px;margin:14px auto 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 0 12px rgba(34,211,107,.45);animation:pg 2.9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pg{0%{width:0}18%{width:22%}52%{width:58%}82%{width:84%}100%{width:100%}}
.steps{list-style:none;margin:18px auto 0;padding:0;max-width:300px;text-align:left;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--dim);font-weight:600}
.steps li.completed{color:#e6f7ec}.steps li{animation:step-in .45s ease both}.steps li:nth-child(1){animation-delay:.18s}.steps li:nth-child(2){animation-delay:.48s}.steps li:nth-child(3){animation-delay:.78s}.steps li:nth-child(4){animation-delay:1.08s}@keyframes step-in{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.steps .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;color:transparent;flex:none}
.steps li.completed .ck{background:var(--green);border-color:var(--green);color:#03150a}
@keyframes stp{to{color:#e6f7ec}}
@keyframes ck{to{background:var(--green);border-color:var(--green);color:#03150a}}
.analyzing .mono{font-family:var(--mono);color:var(--g1);font-size:12px;margin-top:5px}

/* Live signal analysis animation */
.live-analyzing{margin:11px;border-radius:22px;border:1px solid var(--line);padding:20px 13px;text-align:center;background:radial-gradient(circle at 50% 35%,rgba(34,197,94,.13),rgba(3,13,8,.94) 72%);box-shadow:inset 0 0 24px rgba(34,197,94,.045)}
.live-scan{height:164px;max-width:520px;margin:0 auto;border-radius:17px;overflow:hidden;position:relative;border:1px solid rgba(34,197,94,.32);background-image:linear-gradient(rgba(34,197,94,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.11) 1px,transparent 1px),linear-gradient(145deg,#071c12,#031009);background-size:25px 25px,25px 25px,auto;animation:live-grid 7s linear infinite;box-shadow:0 0 18px rgba(34,211,107,.12)}
.live-scan:before{content:"";position:absolute;left:0;right:0;top:-35px;height:36px;background:linear-gradient(180deg,transparent,rgba(34,211,107,.28));border-bottom:2px solid var(--g1);box-shadow:0 5px 20px rgba(34,211,107,.55);animation:live-beam 2.5s ease-in-out infinite}
.live-scan:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(34,211,107,.10),transparent 58%);animation:live-breathe 2.6s ease-in-out infinite}
.live-bars{position:absolute;inset:15px 10px;display:flex;align-items:center;justify-content:space-around;gap:3px}
.live-bars i{position:relative;display:block;width:5px;height:var(--h);border-radius:1px;background:var(--c);box-shadow:0 0 5px color-mix(in srgb,var(--c),transparent 45%);animation:candle-flicker 1.4s ease-in-out infinite alternate;animation-delay:var(--d)}
.live-bars i:before{content:"";position:absolute;width:1px;left:2px;top:-6px;bottom:-6px;background:var(--c);opacity:.85}
.live-scan .corner{position:absolute;width:17px;height:17px;border-color:var(--g1);border-style:solid;z-index:2}
.live-scan .tl{top:8px;left:8px;border-width:2px 0 0 2px;border-radius:5px 0 0}.live-scan .tr{top:8px;right:8px;border-width:2px 2px 0 0;border-radius:0 5px 0 0}.live-scan .bl{bottom:8px;left:8px;border-width:0 0 2px 2px;border-radius:0 0 0 5px}.live-scan .br{bottom:8px;right:8px;border-width:0 2px 2px 0;border-radius:0 0 5px 0}
.live-analyzing .mono{font-family:var(--mono);font-size:12px;color:var(--g1);margin:11px 0 0;letter-spacing:.02em;animation:live-text 1.3s ease-in-out infinite}
.live-progress{height:6px;margin:14px 0 15px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}.live-progress i{display:block;width:0;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g2),var(--g1));box-shadow:0 0 12px rgba(34,211,107,.45);animation:live-progress 5s ease-out forwards}
.live-steps{max-width:300px;margin:0 auto;padding:0;list-style:none;text-align:left;display:grid;gap:9px}.live-steps li{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:13px;font-weight:600;animation:live-step .35s ease both}.live-steps li:nth-child(1){animation-delay:.2s}.live-steps li:nth-child(2){animation-delay:.75s}.live-steps li:nth-child(3){animation-delay:1.3s}.live-steps li:nth-child(4){animation-delay:1.85s}.live-steps .tick{width:19px;height:19px;border:1.5px solid var(--dim);border-radius:50%;flex:none;display:grid;place-items:center;color:transparent}.live-steps li.done{color:#e6f7ec}.live-steps li.done .tick{background:var(--green);border-color:var(--green);color:#03150a}
@keyframes live-grid{to{background-position:25px 25px,25px 25px,0 0}}@keyframes live-beam{0%{top:-36px;opacity:.2}15%,85%{opacity:1}100%{top:100%;opacity:.15}}@keyframes live-breathe{50%{opacity:.45}}@keyframes candle-flicker{from{filter:brightness(.8);transform:scaleY(.94)}to{filter:brightness(1.2);transform:scaleY(1.04)}}@keyframes live-text{50%{opacity:.62}}@keyframes live-progress{0%{width:0}25%{width:24%}55%{width:57%}82%{width:82%}100%{width:100%}}@keyframes live-step{to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce-DISABLED){.live-scan,.live-scan:before,.live-scan:after,.live-bars i,.live-analyzing .mono,.live-progress i,.live-steps li{animation:none!important}.live-progress i{width:100%}}

<style id="confidence-count-up-animation">
.ref-panel .ring div{display:flex;align-items:center;justify-content:center;position:relative;}

<script>
(function(){
  function animateConfidence(el){
    if(!el || el.dataset.countAnimated==='1') return;
    const text=el.textContent.trim();
    const m=text.match(/([0-9]+(?:\.[0-9]+)?)(\s*%?)/);
    if(!m) return;
    const target=parseFloat(m[1]);
    if(!isFinite(target)) return;
    const suffix=m[2].includes('%')?'%':'';
    const small=el.querySelector('small');
    el.dataset.countAnimated='1';
    const start=performance.now();
    const duration=1200;
    function frame(now){
      const p=Math.min(1,(now-start)/duration);
      const eased=1-Math.pow(1-p,3);
      const value=Math.round(target*eased);
      if(small){ el.childNodes[0].nodeValue=value; }
      else { el.textContent=value+suffix; }
      if(p<1) requestAnimationFrame(frame);
      else if(small) el.childNodes[0].nodeValue=Math.round(target);
    }
    if(small){
      while(el.firstChild) el.removeChild(el.firstChild);
      el.appendChild(document.createTextNode('0'));
      el.appendChild(small);
    } else el.textContent='0'+suffix;
    requestAnimationFrame(frame);
  }
  function scan(){
    document.querySelectorAll('.ref-panel .ring div').forEach(animateConfidence);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',scan); else scan();
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<style id="motion-pack">
/* ===== Chopi AI motion pack — entrance, stagger, press, modal, ambient ===== */
:root{--ease-out:cubic-bezier(.22,.8,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1)}

/* ---- Screen entrance (only when the screen/step changes; class set by JS) ---- */
@keyframes mp-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mp-pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes mp-slide-r{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes mp-fade{from{opacity:0}to{opacity:1}}

.anim-enter .top{animation:mp-fade .35s var(--ease-out) both}
.anim-enter .page-head,
.anim-enter .setup-head{animation:mp-slide-r .45s var(--ease-out) both}
.anim-enter .page>.card,
.anim-enter .page>section,
.anim-enter .welcome,
.anim-enter .an-top-visual,
.anim-enter .sheet,
.anim-enter .cfg{animation:mp-rise .5s .06s var(--ease-out) both}

/* Stagger helper: children get --i from JS */
.anim-enter .kpi,
.anim-enter .tcard,
.anim-enter .sp,
.anim-enter .recent .qc,
.anim-enter .news-event,
.anim-enter .field,
.anim-enter .pair,
.anim-enter .trio>div,
.anim-enter .stat,
.anim-enter .info-row,
.anim-enter .sum>div,
.anim-enter .tools .tool{
  animation:mp-rise .5s var(--ease-out) both;
  animation-delay:calc(var(--i,0)*45ms + 120ms);
}
.anim-enter .pair{animation-name:mp-pop;animation-duration:.38s;animation-delay:calc(var(--i,0)*22ms + 100ms)}
.anim-enter .tbl-row{animation:mp-fade .35s both;animation-delay:calc(var(--i,0)*18ms + 150ms)}
.anim-enter .limit,.anim-enter .sess,.anim-enter .queue-hint,.anim-enter .disc{animation:mp-rise .5s .3s var(--ease-out) both}
.anim-enter .track i{animation:mp-bar .9s .4s var(--ease-out) both}
@keyframes mp-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.track i,.prog i{transform-origin:left center}

/* ---- Ambient life ---- */
/* Welcome candles gently breathe */
@keyframes mp-candle-up{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mp-candle-dn{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.cc .candle.up{animation:mp-candle-up 3.2s ease-in-out infinite}
.cc .candle.dn{animation:mp-candle-dn 3.2s ease-in-out infinite}
.cc .tag-buy,.cc .tag-sell{animation:mp-fade .6s .5s both}
/* Logo avatars soft glow */
@keyframes mp-avatar-glow{0%,100%{box-shadow:0 0 11px rgba(34,211,107,.5)}50%{box-shadow:0 0 20px rgba(34,211,107,.85)}}
.top .avatar{animation:mp-avatar-glow 3.4s ease-in-out infinite}
/* Status dots breathe */
@keyframes mp-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.chip .dot,.page-head .dot,.setup-head .dot,.sp.open .dot{animation:mp-dot 1.8s ease-in-out infinite}
/* Activate Engine button: slow glow pulse + shine sweep */
@keyframes mp-btn-glow{0%,100%{box-shadow:0 0 20px rgba(20,229,126,.26),inset 0 1.5px 0 rgba(255,255,255,.4)}50%{box-shadow:0 0 34px rgba(20,229,126,.5),inset 0 1.5px 0 rgba(255,255,255,.5)}}
@keyframes mp-sheen{0%,60%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(520%) skewX(-18deg)}}
.p-dashboard>.btn[data-act="engine"],
.live-generate-wrap .btn,
.auth-submit{position:relative;overflow:hidden;animation:mp-btn-glow 3s ease-in-out infinite}
.p-dashboard>.btn[data-act="engine"]::after,
.live-generate-wrap .btn::after,
.auth-submit::after,
#gs:not(.dis)::after{content:"";position:absolute;top:-30%;bottom:-30%;left:0;width:16%;background:rgba(255,255,255,.28);transform:translateX(-160%) skewX(-18deg);animation:mp-sheen 4.6s 1s ease-in-out infinite;pointer-events:none}
#gs{position:relative;overflow:hidden}
/* Upload drop zone pulse ring */
@keyframes mp-ring{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.pulse{position:relative}
.pulse::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid var(--g1);animation:mp-ring 2.4s ease-out infinite}
.pulse span{animation:mp-orb-float 3.4s ease-in-out infinite}
@keyframes mp-orb-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* Signal result big orb */
.anim-enter .bigorb{animation:mp-pop .6s .25s var(--ease-spring) both}
.anim-enter .bigsig h1{animation:mp-rise .5s .45s var(--ease-out) both}
.anim-enter .ctag{animation:mp-pop .45s .2s var(--ease-spring) both}
.anim-enter .sig-strat{animation:mp-rise .5s .3s var(--ease-out) both}
.anim-enter .conf,.anim-enter .two{animation:mp-rise .5s .55s var(--ease-out) both}
/* Queue rows slide in from the side */
.anim-enter .qrow{animation:mp-slide-r .45s var(--ease-out) both;animation-delay:calc(var(--row-i,0)*60ms + 150ms)}
/* Auth screen */
@keyframes mp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.anim-enter .auth-brand{animation:mp-slide-r .5s var(--ease-out) both}

.auth-brand .avatar{animation:mp-float 4s ease-in-out infinite}
.auth-tab{transition:color .2s,background .25s var(--ease-out),box-shadow .25s}
.auth-title,.auth-desc{animation:mp-fade .4s both}

/* ---- Interaction: hover / press / focus ---- */
.btn,.tcard,.pair,.nav,.qc,.sqb,.change,.back,.presets button,.seg button,.toggle button,.plan-card,.news-event,.strategy-option,.burger,.google-btn,.auth-tab{
  transition:transform .18s var(--ease-out),box-shadow .2s,border-color .2s,background .2s,filter .2s,color .2s}
.btn:active,.tcard:active,.pair:active,.sqb:active,.presets button:active,.google-btn:active,.plan-card:active,.news-event:active{transform:scale(.97)}
@media(hover:hover){
  .tcard:hover,.news-event:hover,.plan-card:hover{transform:translateY(-3px)}
  .pair:hover{transform:translateY(-2px);border-color:var(--green)}

}
.tcard>svg{transition:transform .2s var(--ease-out)}

/* selected pair pop */
@keyframes mp-sel{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.pair.sel{animation:mp-sel .35s var(--ease-spring)}
/* stepper number tick */
.step b{display:inline-block;animation:mp-pop .25s var(--ease-spring)}
.presets button.on{animation:mp-pop .25s var(--ease-spring)}
/* focus glow on inputs */
.inp,.search,.news-input{transition:border-color .2s,box-shadow .25s}
.search:focus-within{border-color:var(--green);box-shadow:0 0 12px rgba(34,211,107,.25)}

/* ---- Drawer, scrim, modals, toast ---- */
.scrim{transition:opacity .3s}
.drawer.on .nav,.drawer.on .profile,.drawer.on .dr-sec,.drawer.on .logout{animation:mp-slide-r .4s var(--ease-out) both;animation-delay:calc(var(--d,0)*35ms + 80ms)}
.modal .mbox,.modal .engine-plans-box,.modal .starter-modal,.modal .plan-detail,.modal .logout-confirm-box,.modal .strategy-picker-box{animation:mp-pop .3s var(--ease-spring) both}
.modal.on .plan-card{animation:mp-rise .4s var(--ease-out) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.modal.on .st2-step,.modal.on .st2-chk{animation:mp-rise .4s var(--ease-out) both;animation-delay:calc(var(--i,0)*70ms + 150ms)}
.modal.on .strategy-option{animation:mp-rise .4s var(--ease-out) both;animation-delay:calc(var(--i,0)*70ms + 100ms)}
.toast{transition:opacity .3s,transform .35s var(--ease-spring)}

/* ---- News detail ---- */
.anim-enter .news-result-sheet{animation:mp-sheet .55s var(--ease-out) both}
@keyframes mp-sheet{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.anim-enter .news-result-stat,.anim-enter .news-bias,.anim-enter .news-logic{animation:mp-rise .5s var(--ease-out) both}
.anim-enter .news-result-stat:nth-child(2){animation-delay:.12s}
.anim-enter .news-bias{animation-delay:.25s}.anim-enter .news-logic{animation-delay:.38s}
.anim-enter .pending-icon{animation:mp-pop .5s .15s var(--ease-spring) both}

/* ---- Accessibility: respect reduced motion ---- */
@media(prefers-reduced-motion:reduce-DISABLED){
  .anim-enter *,.cc .candle,.top .avatar,.chip .dot,.pulse::before,.pulse span,.auth-brand .avatar,
  .p-dashboard>.btn[data-act="engine"],.live-generate-wrap .btn,.auth-submit,
  .btn::after,.pair.sel,.modal *{animation:none!important}
  .tcard:hover,.pair:hover,.nav:hover{transform:none}
}
</style>

<style id="news-signal-style">
.news-result-stat.has-ico{display:flex;align-items:center;gap:14px}
.nrs-ico{flex:none;display:grid;place-items:center;color:#cfc3f2}.nrs-ico .i{width:30px;height:30px}
.news-bias.up{border-color:rgba(52,224,140,.45);background:linear-gradient(120deg,rgba(24,120,80,.27),rgba(33,20,69,.76));box-shadow:inset 0 1px rgba(255,255,255,.04),0 0 30px rgba(52,224,140,.06)}
.news-bias.up .news-bias-icon{background:linear-gradient(145deg,#34e08c,#17a865);box-shadow:0 12px 25px rgba(30,190,120,.25)}
.news-bias.up b{color:#9bfbc6}
.news-bias.up .news-bias-ring{background:conic-gradient(#34e08c calc(var(--p)*1%),rgba(255,255,255,.10) 0);box-shadow:0 0 20px rgba(52,224,140,.18)}
.news-bias.up .news-bias-ring span{color:#c4ffe0}
</style>
</head>

/* ---------- Live strategies: Alpha / ORVEX / TRIONx Crack (M1) ---------- */
const STRATEGIES=[
  {key:'alpha',name:'Alpha Crack',w:'Alpha',accent:'#3ee58a'},
  {key:'orvex',name:'ORVEX Crack',w:'ORVEX',accent:'#2fe6bd'},
  {key:'trionx',name:'TRIONx Crack',w:'TRIONx',accent:'#8cf05a'}
];
function strategyOrb(key,size){
  let g='';
  if(key==='alpha'){
    let d1='',d2='';for(let k=1;k<=130;k++){const r=44*Math.sqrt(k/130),an=k*2.39996,rr=(0.5+1.5*(1-r/44)).toFixed(2);const c='<circle cx="'+(50+r*Math.cos(an)).toFixed(1)+'" cy="'+(50+r*Math.sin(an)).toFixed(1)+'" r="'+rr+'" fill="#b8ffd0" opacity="'+(0.35+0.65*(1-r/44)).toFixed(2)+'"/>';if(k%2)d1+=c;else d2+=c;}
    g='<circle cx="50" cy="50" r="44" fill="url(#gA)" class="o-pulse"/><circle class="o-rip" cx="50" cy="50" r="44" fill="none" stroke="#7dffb0" stroke-width="1.2"/><g class="o-spin-slow"><path d="M50 6V94M6 50H94" stroke="#7dffb0" stroke-opacity=".35" stroke-width=".6"/><g class="o-tw1">'+d1+'</g><g class="o-tw2">'+d2+'</g></g><g class="o-pulse"><circle cx="50" cy="50" r="12" fill="#7dffb0" opacity=".35"/><circle cx="50" cy="50" r="5" fill="#eafff2"/></g>';
  }else if(key==='orvex'){
    const pts=[];for(let k=0;k<9;k++){const an=k*Math.PI*2/9-Math.PI/2;pts.push([50+36*Math.cos(an),50+36*Math.sin(an)]);}
    let l='';pts.forEach((q,i)=>{l+='<path d="M50 50L'+q[0].toFixed(1)+' '+q[1].toFixed(1)+'" stroke="#d9ffe9" stroke-opacity=".5" stroke-width=".8"/>';const n=pts[(i+2)%9];l+='<path d="M'+q[0].toFixed(1)+' '+q[1].toFixed(1)+'L'+n[0].toFixed(1)+' '+n[1].toFixed(1)+'" stroke="#d9ffe9" stroke-opacity=".45" stroke-width=".8"/>';});
    g='<circle class="o-rev" cx="50" cy="50" r="46" fill="none" stroke="#5ee38a" stroke-opacity=".55" stroke-width="1" stroke-dasharray="3 7"/><circle class="o-rip" cx="50" cy="50" r="40" fill="none" stroke="#7dffd0" stroke-width="1.2"/><g class="o-spin-slow o-glow"><polygon points="'+pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+'" fill="url(#gO)" stroke="#d9ffe9" stroke-width="1.4"/>'+l+'</g><circle class="o-pulse" cx="50" cy="50" r="3.2" fill="#fff"/>';
  }else{
    g='<circle class="o-spin" cx="50" cy="50" r="42" fill="none" stroke="#2fe6a0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="12 9"/><g class="o-pulse"><circle cx="50" cy="50" r="31" fill="none" stroke="url(#gT)" stroke-width="7" filter="url(#bl)"/></g><circle class="o-spin-med" cx="50" cy="50" r="31" fill="none" stroke="#e6fff0" stroke-width="2.2" stroke-dasharray="150 45" stroke-linecap="round"/><circle class="o-rev" cx="50" cy="50" r="22" fill="none" stroke="#5ee38a" stroke-opacity=".75" stroke-width="1.3" stroke-dasharray="20 10"/><path class="o-rev" d="M14 58A38 38 0 0 0 40 88" fill="none" stroke="#9dff7a" stroke-opacity=".7" stroke-width="2"/><circle class="o-rip" cx="50" cy="50" r="22" fill="none" stroke="#9dff7a" stroke-width="1.2"/>';
  }
  return '<svg viewBox="0 0 100 100" width="'+(size||100)+'" height="'+(size||100)+'" aria-hidden="true"><defs><radialGradient id="gA"><stop offset="0" stop-color="#1fbf6e" stop-opacity=".55"/><stop offset="1" stop-color="#04180e" stop-opacity="0"/></radialGradient><radialGradient id="gO"><stop offset="0" stop-color="#e9fff3"/><stop offset=".45" stop-color="#34d88a"/><stop offset="1" stop-color="#0b6b45"/></radialGradient><linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fe6a0"/><stop offset="1" stop-color="#8cf05a"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="2.4"/></filter></defs>'+g+'</svg>';
}
function strategyBanner(i){
  const st=STRATEGIES[i]||STRATEGIES[0];
  return `<div class="sbn" style="--a:${st.accent}"><span class="sbn-ico">${strategyOrb(st.key)}</span>
   <div class="sbn-main"><div class="sbn-k">STRATEGY</div>
   <div class="sbn-t"><span class="w">${st.w}</span><span class="g">Crack</span><em>M1</em></div></div>
   <span class="sbn-chev">${I('right',18)}</span></div>`;
}

function authSubmit(){
 const A=S.auth,email=($('#auth-email')?.value||'').trim().toLowerCase(),pass=($('#auth-pass')?.value||'');
 A.email=email;
 if(!email||!email.includes('@')){A.error='Enter a valid email address.';return authRender()}
 if(pass.length<6){A.error='Password must be at least 6 characters.';return authRender()}
 if(A.mode==='register'){
  const name=($('#auth-name')?.value||'').trim();A.name=name;
  if(name.length<2){A.error='Enter your full name.';return authRender()}
  try{localStorage.setItem('chopiDemoUser',JSON.stringify({name,email,pass}))}catch(_){}
  A.authed=true;A.error='';S.screen='dashboard';return render();
 }
 let raw=null;try{raw=localStorage.getItem('chopiDemoUser')}catch(_){}
 if(raw){try{const u=JSON.parse(raw);if(u.email!==email||u.pass!==pass){A.error='Email or password is incorrect.';return authRender()}A.name=u.name||email.split('@')[0]}catch(_){}}
 A.authed=true;A.error='';S.screen='dashboard';render();
}

function dashboard(){

function newsCalc(e){
 const isHigh=e.impact==='High';
 const bias=(e.ccy==='EUR'||e.ccy==='GBP')?'Bullish':'Bearish';
 const conf=isHigh?79:74;
 const base=e.pair.split('/')[0];
 const up=(base===e.ccy)===(bias==='Bullish');
 return{isHigh,bias,conf,dir:up?'CALL':'PUT'};
}
function newsGiveSignal(){

function calc(p){
 const cap=+p.cap,pay=+p.pay/100,tgt=+p.tgt/100,risk=+p.risk/100;let bal=cap,rows=[];
 for(let d=1;d<=30;d++){
  const stake=bal*risk,win=stake*pay,target=bal*tgt,need=Math.max(1,Math.ceil(target/win));
  rows.push({d,start:bal,stake,mtg:stake*2,need,target,end:bal+target});bal+=target;
 }
 return rows;
}

 const r=p.sheet,f=n=>'$'+n.toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:2});

 ${r.map(x=>`<tr><td>${x.d}</td><td>${f(x.start)}</td><td>${f(x.stake)}</td>${p.mtg?`<td class="r">${f(x.mtg)}</td>`:''}<td>${x.need}</td><td class="g">${f(x.end)}</td></tr>`).join('')}

}

const openDrawer=o=>{$('#drawer').classList.toggle('on',o);$('#scrim').classList.toggle('on',o)};
function selectLivePair(pair){
  if(S.screen!=='live'||S.live.step!=='pick'||!pair) return;
  const pool=S.live.mkt==='OTC'?OTC:REAL;
  if(!pool.includes(pair)) return;
  S.live.pair=pair;
  S.live.step='setup';
  S.live.strategyPicker=false;
  $('#scrim').classList.remove('on');
  $('#modal').classList.remove('on');
  render();
  window.scrollTo({top:0});
}
function selectLiveMarket(market){
  if(S.screen!=='live'||(market!=='OTC'&&market!=='Real')) return;
  S.live.mkt=market;
  S.live.q='';
  S.live.pair=null;
  S.live.step='pick';
  $('#scrim').classList.remove('on');
  $('#modal').classList.remove('on');
  render();
}

function go(s){S.screen=s;if(s==='news'){S.news.token=null;S.news.sig=null}if(s==='live'){S.live={mkt:'OTC',q:'',pair:null,step:'pick',sig:null,strategy:0,strategyPicker:false}}
 if(s==='future'){S.signals=null;S.futureStage='idle'}
 if(s==='otc'||s==='real'){S.an={kind:s,stage:'idle',res:null,img:null}}
 /* Always close transient layers when navigating. They otherwise can sit above the pair picker. */
 openDrawer(false);$('#scrim').classList.remove('on');$('#modal').classList.remove('on');render();window.scrollTo({top:0})}

function makeSignal(pair,market=S.mkt){const dir=Math.random()<.55?'CALL':'PUT';return{pair,market:market==='OTC'?'OTC':'REAL',dir,conf:rnd(72,92),time:timeNow(rnd(1,3))}}
function analyze(){
 S.an.stage='run';render();
 setTimeout(()=>{
  const pair=(S.an.kind==='real'?REAL:OTC)[rnd(0,11)];const base=rnd(1000,99999)/10,dir=Math.random()<.5?'CALL':'PUT';
  S.an.res={pair,dir,conf:rnd(74,92),res:(base+rnd(3,9)).toFixed(2),sup:base.toFixed(2),
   trend:dir==='CALL'?'Short-Term Bullish':'Short-Term Bearish',pattern:dir==='CALL'?'Bullish Engulfing':'Bearish Engulfing'};
  pushHist({pair:S.an.res.pair,dir:S.an.res.dir,conf:S.an.res.conf,src:S.an.kind==='real'?'Real chart':'OTC chart',time:timeNow(0)});S.an.stage='done';render();window.scrollTo({top:0});
 },2900);
}

function sampleChart(){
 const c=document.createElement('canvas');c.width=640;c.height=400;const x=c.getContext('2d');
 x.fillStyle='#0a1a13';x.fillRect(0,0,640,400);x.strokeStyle='rgba(255,255,255,.07)';
 for(let i=1;i<8;i++){x.beginPath();x.moveTo(0,i*50);x.lineTo(640,i*50);x.stroke()}
 let p=200;for(let i=0;i<40;i++){const o=p;let cl=o+(Math.random()-.48)*30;cl=Math.min(330,Math.max(70,cl));
  const hi=Math.max(o,cl)+Math.random()*12,lo=Math.min(o,cl)-Math.random()*12,up=cl>=o,cx=i*15.5+14;
  x.strokeStyle=x.fillStyle=up?'#22d36b':'#ff3347';x.lineWidth=1.5;x.beginPath();x.moveTo(cx,hi);x.lineTo(cx,lo);x.stroke();
  x.fillRect(cx-5,Math.min(o,cl),10,Math.max(3,Math.abs(cl-o)));p=cl}
 return c.toDataURL('image/jpeg',.85)}

function loadFile(f){
 if(!f||!(f.type||'').startsWith('image/'))return toast('Please choose a PNG, JPG or WEBP image');
 const r=new FileReader();r.onload=()=>{S.an.img=r.result;analyze()};r.onerror=()=>toast('Could not read that image');r.readAsDataURL(f)}

<script id="live-confidence-countup">
(function(){
  function run(){
    document.querySelectorAll('.p-live .conf .ring div').forEach(function(el){
      if(el.dataset.liveCounted==='1') return;
      var m=el.textContent.match(/(\d+(?:\.\d+)?)\s*%/); if(!m) return;
      var target=parseFloat(m[1]); el.dataset.liveCounted='1';
      var start=performance.now(), dur=1200;
      function tick(now){
        var q=Math.min(1,(now-start)/dur), eased=1-Math.pow(1-q,3);
        el.textContent=Math.round(target*eased)+'%';
        if(q<1) requestAnimationFrame(tick);
      }
      el.textContent='0%'; requestAnimationFrame(tick);
    });
  }
  run(); new MutationObserver(run).observe(document.getElementById('app')||document.documentElement,{childList:true,subtree:true});
})();
</script>
<script id="motion-pack-js">
(function(){
  var app=document.getElementById('app'),drawerEl=document.getElementById('drawer'),modalEl=document.getElementById('modal');
  var lastKey=null,timer=null;

  /* Number each repeated item so CSS can stagger them */
  function stagger(root,sel,attr){
    var n=0,parentMap=new Map();
    root.querySelectorAll(sel).forEach(function(el){
      var p=el.parentElement,i=parentMap.get(p)||0;
      el.style.setProperty(attr||'--i',i);parentMap.set(p,i+1);
    });
  }
  function decorate(){
    if(!app)return;
    stagger(app,'.kpi,.tcard,.sp,.recent .qc,.news-event,.field,.trio>div,.stat,.info-row,.sum>div');
    stagger(app,'.pair');
    stagger(app,'.auth-input');
    stagger(app,'tbody tr');
    app.querySelectorAll('tbody tr').forEach(function(r){r.classList.add('tbl-row')});
  }
  function decorateDrawer(){
    var i=0;drawerEl.querySelectorAll('.profile,.nav,.dr-sec,.logout').forEach(function(el){el.style.setProperty('--d',i++)});
  }
  function decorateModal(){
    stagger(modalEl,'.plan-card');stagger(modalEl,'.st2-step');stagger(modalEl,'.st2-chk');stagger(modalEl,'.strategy-option');
  }
  function screenKey(){
    try{
      return [S.screen,S.live&&S.live.step,S.an&&S.an.stage,S.futureStage,S.signals?1:0,S.plan&&S.plan.tab,S.plan&&S.plan.sheet?1:0,S.auth&&S.auth.mode,S.news&&S.news.busy?1:0].join('|');
    }catch(e){return Math.random()}
  }
  function after(){
    var key=screenKey(),changed=key!==lastKey;lastKey=key;
    decorate();
    if(changed){
      app.classList.remove('anim-enter');void app.offsetWidth;app.classList.add('anim-enter');
      clearTimeout(timer);timer=setTimeout(function(){app.classList.remove('anim-enter')},2400);
    }else{
      app.classList.remove('anim-enter');   /* small updates (counter, toggle) don't replay the entrance */
    }
  }

  var origRender=window.render,origAuth=window.authRender;
  var depth=0;
  function wrap(fn){return function(){depth++;try{return fn.apply(this,arguments)}finally{depth--;if(depth===0)after()}}}
  window.render=wrap(origRender);
  window.authRender=wrap(origAuth);

  /* Drawer + modal: decorate when their content/state changes */
  new MutationObserver(decorateDrawer).observe(drawerEl,{childList:true});
  new MutationObserver(decorateModal).observe(modalEl,{childList:true});

  /* Count-up for the numbers that appear in results (confidence handled by existing scripts) */
  /* Initial paint */
  decorateDrawer();lastKey=null;after();
})();
</script>
